name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches:
      - development
      - production
  pull_request:
    branches:
      - production

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      id: build_binary_wheel
      run: python3 -m build
    - name: Build Wheel status
      if: steps.build_binary_wheel.outcome == 'failure'
      run: exit 1
    - name: Store the distribution packages
      id: store_distribution_packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Distribution storage status
      if: steps.store_distribution_packages.outcome == 'failure'
      run: exit 1

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quotes-library  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true


  github-release:
    name: GitHub Release + Sigstore Signing 🔐
    if: github.ref == 'refs/heads/production' && success()
    needs: publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: download-artifacts
        name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - id: sigstore-sign
        name: Sign packages with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl

      - id: get-version
        name: Extract version from pyproject.toml
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - id: create-release
        name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.get-version.outputs.version }}" --title "v${{ steps.get-version.outputs.version }}" --repo "${{ github.repository }}" --notes "Release v${{ steps.get-version.outputs.version }}" || echo "Release already exists"

      - id: upload-to-release
        name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.get-version.outputs.version }}" dist/** --repo "${{ github.repository }}"